# dsh-xmind-mcp —— 进程内 Host 插件（不再有子进程）
#
# 为什么不是 stdio 型 MCP：端侧宿主（HarmonyOS/DSHM 等）禁止 fork/exec、也没有 node
# 可执行文件，spawn 必然失败，表现为 `mcp-client(xmind): server is disconnected`，而且
# 桥一次都不会被执行。本补丁改为插入插件自身：
#
#   · name 是包名，由 loader 从 profile 的 node_modules 解析到本包 main（host/index.mjs），
#   · OAuth（动态注册 + PKCE + 127.0.0.1 回调）与远端 MCP 调用都在**宿主进程内**完成；
#   · 云端工具用 ctx.tools.register 注册为原生 dsh 工具（名字沿用 xmind_*）；
#   · 只用 node: 内置模块与全局 fetch，不解析任何裸包名（端侧工作区没有 node_modules）；
#   · 激活期间绝不 throw：失败只写 $DSH_HOME/xmind-mcp/bridge.log，不拖垮宿主启动。
#
# 可调环境变量：
#   XMIND_MCP_ORIGIN       默认 https://app.xmind.cn（中国站）；国际站 https://app.xmind.com
#   XMIND_MCP_TIMEOUT_MS   单次云端工具调用超时，默认 240000（建图/改写常需 30–120 秒）
#   XMIND_MCP_HOME         凭据与日志目录，默认 <DSH_HOME>/xmind-mcp
- insert:
    - id: xmind-mcp
      name: 'dsh-xmind-mcp'
